<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Will You Go On A Date With Me? ❤️</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Great+Vibes&display=swap" rel="stylesheet">

</head>

<body>

<div id="hearts"></div>

<div class="container">

<div class="card">

<h2 class="hello">
Hey,
<span id="girlName">
Sarah
</span>
❤️
</h2>

<p class="smallText">
I have something important to ask you...
</p>

<button id="startButton">
Open 💌
</button>

</div>

</div>

<section id="questionSection">

<div class="questionCard">

<h1 id="question">
Will you go out with me on a date?
</h1>

<p class="subtitle">

I promise it'll be worth it 😊

</p>

<div class="buttons">

<button id="yesBtn">

💕 YES 💕

</button>

<button id="noBtn">

NO 🙈

</button>

</div>

<p id="funnyText"></p>

</div>

</section>

<section id="dateSection">

<div class="dateCard">

<h1>

🥹❤️

</h1>

<h2>

You just made my day!

</h2>

<p>

Please choose a date and time.

</p>

<input
type="date"
id="date">

<input
type="time"
id="time">

<div class="robot">

<input
type="checkbox"
id="robot">

<label for="robot">

I'm not a robot 🤖

</label>

</div>

<button id="submitBtn">

Submit ❤️

</button>

</div>

</section>

<section id="successSection">

<div class="successCard">

<h1>

❤️ YAAAAY!! ❤️

</h1>

<p id="typeMessage">

</p>

<button id="restart">

Replay 💖

</button>

</div>

</section>

<div id="popup">

<div id="popupBox">

<h2>

⚠ Error

</h2>

<p>

This heart has experienced an unexpected rejection.

</p>

<p>

Recovering...

<span id="countdown">

5

</span>

</p>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
